<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b16">
  <title>Neon Clock</title>
  <style>
    :root {
      color-scheme: dark;
      --blue: #4db8ff;
      --blue-bright: #8bd5ff;
      --ink: #080b16;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #edf7ff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 50% 43%, rgba(14, 57, 102, .28), transparent 48%),
        radial-gradient(circle at 15% 15%, rgba(38, 105, 174, .12) 1px, transparent 1.5px) 0 0 / 34px 34px,
        var(--ink);
    }

    main {
      width: min(92vw, 680px);
      padding: clamp(2rem, 7vw, 4.5rem) clamp(1.5rem, 7vw, 4rem);
      text-align: center;
      border: 1px solid rgba(91, 176, 255, .22);
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(16, 26, 46, .86), rgba(8, 13, 27, .9));
      box-shadow: 0 0 70px rgba(25, 124, 217, .12), inset 0 1px rgba(255, 255, 255, .04);
      backdrop-filter: blur(12px);
    }

    .eyebrow {
      margin: 0 0 1.4rem;
      color: #83b8df;
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .32em;
      text-transform: uppercase;
    }

    .clock {
      margin: 0;
      color: #f4fbff;
      font-size: clamp(3.5rem, 13vw, 6.6rem);
      font-variant-numeric: tabular-nums;
      font-weight: 300;
      letter-spacing: .025em;
      line-height: 1;
      text-shadow: 0 0 22px rgba(77, 184, 255, .3);
    }

    .date {
      min-height: 1.5em;
      margin: 1.2rem 0 2.6rem;
      color: #91a8bd;
      font-size: .92rem;
      letter-spacing: .08em;
    }

    .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: .85rem; }

    button {
      min-width: 132px;
      padding: .85rem 1.25rem;
      border: 1px solid rgba(77, 184, 255, .8);
      border-radius: 10px;
      color: var(--blue-bright);
      background: rgba(25, 112, 190, .1);
      box-shadow: 0 0 16px rgba(37, 155, 255, .13), inset 0 0 12px rgba(37, 155, 255, .05);
      font: inherit;
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .2s ease, box-shadow .2s ease, transform .2s ease;
    }

    button:hover, button:focus-visible {
      outline: none;
      color: white;
      background: rgba(36, 142, 225, .28);
      box-shadow: 0 0 24px rgba(47, 166, 255, .36), inset 0 0 16px rgba(77, 184, 255, .12);
      transform: translateY(-2px);
    }

    button:active { transform: translateY(0); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main aria-label="Digital clock">
    <p class="eyebrow">Local time</p>
    <time class="clock" id="clock" aria-label="Current time">00:00:00</time>
    <p class="date" id="date"></p>
    <nav class="actions" aria-label="Clock display options">
      <button type="button" id="formatButton" aria-pressed="false">12-hour</button>
      <button type="button" id="secondsButton" aria-pressed="true">Hide seconds</button>
    </nav>
  </main>

  <script>
    const clock = document.querySelector('#clock');
    const date = document.querySelector('#date');
    const formatButton = document.querySelector('#formatButton');
    const secondsButton = document.querySelector('#secondsButton');
    let use24Hour = true;
    let showSeconds = true;

    function updateClock() {
      const now = new Date();
      clock.dateTime = now.toISOString();
      clock.textContent = new Intl.DateTimeFormat(undefined, {
        hour: '2-digit', minute: '2-digit', second: showSeconds ? '2-digit' : undefined,
        hour12: !use24Hour
      }).format(now);
      date.textContent = new Intl.DateTimeFormat(undefined, {
        weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'
      }).format(now);
    }

    formatButton.addEventListener('click', () => {
      use24Hour = !use24Hour;
      formatButton.textContent = use24Hour ? '12-hour' : '24-hour';
      formatButton.setAttribute('aria-pressed', String(!use24Hour));
      updateClock();
    });

    secondsButton.addEventListener('click', () => {
      showSeconds = !showSeconds;
      secondsButton.textContent = showSeconds ? 'Hide seconds' : 'Show seconds';
      secondsButton.setAttribute('aria-pressed', String(showSeconds));
      updateClock();
    });

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
